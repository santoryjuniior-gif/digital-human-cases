<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI数字人直播案例库</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #2c1810 0%, #5c3a20 50%, #8a5a30 100%);
    padding: 50px 24px 70px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(226,118,60,0.3) 0%, transparent 70%);
    top: -100px; right: -100px;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(232,96,138,0.2) 0%, transparent 70%);
    bottom: -80px; left: -80px;
  }
  .hero .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    color: #ffd4a8;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .hero h1 {
    font-size: 30px;
    color: #fff;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
    font-weight: 700;
  }
  .hero p {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    position: relative;
    z-index: 1;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 520px;
    margin: -40px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 2;
  }
  .card {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 4/5;
    text-decoration: none;
    display: block;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px;
  }
  .card-emoji { font-size: 28px; margin-bottom: 6px; }
  .card-name {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card-arrow {
    color: rgba(255,255,255,0.8);
    font-size: 12px;
  }

  /* FORM */
  .form-section {
    max-width: 520px;
    margin: 32px auto;
    padding: 0 16px;
  }
  .form-card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .form-title {
    text-align: center;
    margin-bottom: 4px;
  }
  .form-title h2 {
    font-size: 20px;
    color: #3c2d1e;
    margin-bottom: 6px;
  }
  .form-title .highlight {
    color: #e74c3c;
  }
  .form-title p {
    font-size: 13px;
    color: #999;
  }
  .field { margin-top: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field label .req { color: #e74c3c; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e8e0d4;
    border-radius: 10px;
    font-size: 15px;
    background: #fafaf7;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: #E2763C;
    background: #fff;
  }
  .field textarea { height: 76px; resize: none; }
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #E2763C, #d4632a);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
  }

  /* SUCCESS */
  .success-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .success-overlay.show { display: flex; }
  .success-box {
    background: #fff;
    border-radius: 20px;
    padding: 28px 20px;
    max-width: 280px;
    width: 100%;
    text-align: center;
  }
  .success-box h3 { font-size: 19px; color: #333; margin-bottom: 6px; }
  .success-box p { font-size: 14px; color: #666; margin-bottom: 16px; }
  .success-box img {
    width: 220px; height: auto;
    border-radius: 12px;
    margin: 0 auto 12px;
    display: block;
  }
  .success-box .tip { font-size: 13px; color: #999; }
  .success-box .close-btn {
    margin-top: 16px;
    padding: 10px 30px;
    background: #f0ebe2;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    color: #666;
  }

  .footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: #b0a595;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="badge">AI数字人 · 7×24小时直播</div>
    <h1>数字人直播案例库</h1>
    <p>6大行业实战案例，扫码查看效果</p>
  </div>

  <div class="grid">
    <a class="card" href="./pet/" style="--accent:#E2763C">
      <img src="https://nickchen19941005-dot.github.io/digital-human-cases/pet/pet1_poster.jpg" alt="宠物行业案例" loading="lazy">
      <div class="card-overlay">
        <span class="card-emoji">🐾</span>
        <span class="card-name">宠物行业</span>
        <span class="card-arrow">查看案例 →</span>
      </div>
    </a>
    <a class="card" href="./fmcg/" style="--accent:#E2763C">
      <img src="https://nickchen19941005-dot.github.io/digital-human-cases/fmcg/ryynt_poster.jpg" alt="快消行业案例" loading="lazy">
      <div class="card-overlay">
        <span class="card-emoji">🛒</span>
        <span class="card-name">快消行业</span>
        <span class="card-arrow">查看案例 →</span>
      </div>
    </a>
    <a class="card" href="./beauty/" style="--accent:#E8608A">
      <img src="https://nickchen19941005-dot.github.io/digital-human-cases/beauty/joocyee_poster.jpg" alt="美妆行业案例" loading="lazy">
      <div class="card-overlay">
        <span class="card-emoji">💄</span>
        <span class="card-name">美妆行业</span>
        <span class="card-arrow">查看案例 →</span>
      </div>
    </a>
    <a class="card" href="./baby/" style="--accent:#2FA39C">
      <img src="https://nickchen19941005-dot.github.io/digital-human-cases/baby/babycare_poster.jpg" alt="母婴行业案例" loading="lazy">
      <div class="card-overlay">
        <span class="card-emoji">🍼</span>
        <span class="card-name">母婴行业</span>
        <span class="card-arrow">查看案例 →</span>
      </div>
    </a>
    <a class="card" href="./home/" style="--accent:#3E8FA0">
      <img src="https://nickchen19941005-dot.github.io/digital-human-cases/home/home1_poster.jpg" alt="家居行业案例" loading="lazy">
      <div class="card-overlay">
        <span class="card-emoji">🏠</span>
        <span class="card-name">家居行业</span>
        <span class="card-arrow">查看案例 →</span>
      </div>
    </a>
    <a class="card" href="./fashion/" style="--accent:#9B59B6">
      <img src="https://nickchen19941005-dot.github.io/digital-human-cases/fashion/jimmy_poster.jpg" alt="鞋服行业案例" loading="lazy">
      <div class="card-overlay">
        <span class="card-emoji">👗</span>
        <span class="card-name">鞋服行业</span>
        <span class="card-arrow">查看案例 →</span>
      </div>
    </a>
  </div>

  <div class="form-section">
    <div class="form-card">
      <div class="form-title">
        <h2>留资可领取<span class="highlight">免费试播</span>机会</h2>
        <p>填写信息，商务1对1沟通方案</p>
      </div>
      <form id="leadForm">
        <div class="field">
          <label>公司名称/品牌 <span class="req">*</span></label>
          <input type="text" id="company" placeholder="请输入公司或品牌名" required>
        </div>
        <div class="field">
          <label>所属行业 <span class="req">*</span></label>
          <select id="industry" required>
            <option value="">请选择行业</option>
            <option value="宠物">宠物</option>
            <option value="快消">快消</option>
            <option value="美妆">美妆</option>
            <option value="母婴">母婴</option>
            <option value="家居">家居</option>
            <option value="鞋服">鞋服</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="field">
          <label>联系方式 <span class="req">*</span></label>
          <input type="tel" id="phone" placeholder="请输入手机号" required>
        </div>
        <div class="field">
          <label>想通过数字人解决什么问题（选填）</label>
          <textarea id="need" placeholder="如：降低直播成本、24小时不间断直播、多平台同时开播等"></textarea>
        </div>
        <button type="button" class="submit-btn" onclick="submitLeadForm()">提交，领取免费试播</button>
      </form>
    </div>
  </div>

  <div class="footer">kai · 一知智能 | 153 5663 5669</div>

  <div class="success-overlay" id="successOverlay">
    <div class="success-box">
      <h3>提交成功！</h3>
      <p>等待商务和您联系</p>
      <button class="close-btn" onclick="document.getElementById('successOverlay').style.display='none'">关闭</button>
    </div>
  </div>

<script>
function submitLeadForm(){
  var c=document.getElementById("company").value.trim();
  var i=document.getElementById("industry").value;
  var p=document.getElementById("phone").value.trim();
  var n=document.getElementById("need").value.trim()||"未填写";
  if(!c||!i||!p){alert("请填写完整必填信息");return;}
  document.getElementById("successOverlay").style.display="flex";
  var t="📋 新客资提交\n🏢 公司/品牌："+c+"\n🏭 行业："+i+"\n📞 联系方式："+p+"\n💡 需求："+n;
  fetch("https://open.feishu.cn/open-apis/bot/v2/hook/663a079a-bce6-4f47-8856-0cdf64f02d4c",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({msg_type:"text",content:{text:t}})
  }).catch(function(){});
}
</script>
</body>
</html>
