<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI数字人直播案例库</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
  }
  .hero {
    background: linear-gradient(135deg, #2c1810 0%, #5c3a20 50%, #8a5a30 100%);
    padding: 50px 24px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(226,118,60,0.3) 0%, transparent 70%);
    top: -100px; right: -100px;
  }
  .hero .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    color: #ffd4a8;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .hero h1 {
    font-size: 30px;
    color: #fff;
    position: relative;
    z-index: 1;
  }
  .hero p {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }
  .grid {
    padding: 24px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
    text-decoration: none;
    color: #1a1a1a;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: transform 0.2s;
  }
  .card:active { transform: scale(0.97); }
  .card .icon { font-size: 36px; margin-bottom: 10px; }
  .card .name { font-size: 16px; font-weight: 600; }
  .card .desc { font-size: 12px; color: #888; margin-top: 6px; }
  .card .arrow { font-size: 12px; color: #E2763C; margin-top: 10px; }
  .footer {
    text-align: center;
    padding: 30px 20px 40px;
    color: #aaa;
    font-size: 12px;
  }
  .live-section {
    padding: 20px 16px;
  }
  .live-title {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 14px;
    padding-left: 4px;
  }
  .live-title span {
    color: #E2763C;
  }
  .live-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .live-item {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: #1a1a1a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .live-item:active { transform: scale(0.98); }
  .live-item .store-name {
    font-size: 15px;
    font-weight: 500;
  }
  .live-item .store-tag {
    font-size: 11px;
    color: #E2763C;
    background: #fff5ee;
    padding: 3px 10px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="badge">AI数字人 · 7×24小时直播</div>
    <h1>数字人直播案例库</h1>
    <p>6大行业实战案例 · 点击查看效果</p>
  </div>
  <div class="grid">
    <a class="card" href="../pet/">
      <div class="icon">🐾</div>
      <div class="name">宠物行业</div>
      <div class="desc">宠物用品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="../fmcg/">
      <div class="icon">🛒</div>
      <div class="name">快消行业</div>
      <div class="desc">快消品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="../beauty/">
      <div class="icon">💄</div>
      <div class="name">美妆行业</div>
      <div class="desc">美妆个护数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="../baby/">
      <div class="icon">🍼</div>
      <div class="name">母婴行业</div>
      <div class="desc">母婴用品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="../home/">
      <div class="icon">🏠</div>
      <div class="name">家居行业</div>
      <div class="desc">家居用品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="../fashion/">
      <div class="icon">👗</div>
      <div class="name">鞋服行业</div>
      <div class="desc">鞋服品牌数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
  </div>
  <div class="live-section">
    <div class="live-title">🔴 正在直播的客户参考</div>
    <div class="live-list">
      <button class="live-item" onclick="copyShop('肯迪文官方旗舰店')">
        <div class="store-name">肯迪文官方旗舰店</div>
        <div class="store-tag">点复制</div>
      </button>
      <button class="live-item" onclick="copyShop('FOOTINDUSTRY旗舰店')">
        <div class="store-name">FOOTINDUSTRY旗舰店</div>
        <div class="store-tag">点复制</div>
      </button>
      <button class="live-item" onclick="copyShop('JIMMY CHOO官方旗舰店')">
        <div class="store-name">JIMMY CHOO官方旗舰店</div>
        <div class="store-tag">点复制</div>
      </button>
    </div>
    <p style="font-size:11px;color:#aaa;text-align:center;margin-top:8px;">微信跳淘宝不方便，建议直接搜索，一键复制去淘宝看</p>
  </div>
  <div class="footer">点击行业卡片，查看真实直播回放</div>
<script>
function copyShop(name){
  var ta=document.createElement("textarea");
  ta.value=name;
  ta.style.position="fixed";
  ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;";
  ov.innerHTML='<div style="background:#fff;border-radius:16px;padding:24px;text-align:center;max-width:280px;">'
    +'<div style="font-size:18px;font-weight:700;">✅ 店名已复制</div>'
    +'<div style="font-size:13px;color:#666;margin-top:8px;">打开淘宝APP，粘贴搜索即可</div>'
    +'</div>';
  ov.onclick=function(){ov.remove();};
  document.body.appendChild(ov);
}
</script>
<script>
(function(){
  var path=location.pathname;
  var ref=document.referrer||"直接扫码";
  var d=new Date();
  var t=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+" "+d.getHours()+":"+d.getMinutes();
  var text="👀 访客访问\n页面："+path+"\n时间："+t+"\n来源："+ref;
  fetch("https://open.feishu.cn/open-apis/bot/v2/hook/663a079a-bce6-4f47-8856-0cdf64f02d4c",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({msg_type:"text",content:{text:text}})
  }).catch(function(){});
})();
</script></body>
</html>
