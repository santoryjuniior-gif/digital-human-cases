<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI数字人直播案例库</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
  }
  .hero {
    background: linear-gradient(135deg, #2c1810 0%, #5c3a20 50%, #8a5a30 100%);
    padding: 50px 24px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(226,118,60,0.3) 0%, transparent 70%);
    top: -100px; right: -100px;
  }
  .hero .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    color: #ffd4a8;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .hero h1 {
    font-size: 30px;
    color: #fff;
    position: relative;
    z-index: 1;
  }
  .hero p {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }
  .grid {
    padding: 24px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
    text-decoration: none;
    color: #1a1a1a;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    transition: transform 0.2s;
  }
  .card:active { transform: scale(0.97); }
  .card .icon { font-size: 36px; margin-bottom: 10px; }
  .card .name { font-size: 16px; font-weight: 600; }
  .card .desc { font-size: 12px; color: #888; margin-top: 6px; }
  .card .arrow { font-size: 12px; color: #E2763C; margin-top: 10px; }
  .footer {
    text-align: center;
    padding: 30px 20px 40px;
    color: #aaa;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="badge">AI数字人 · 7×24小时直播</div>
    <h1>数字人直播案例库</h1>
    <p>6大行业实战案例 · 点击查看效果</p>
  </div>
  <div class="grid">
    <a class="card" href="./pet/">
      <div class="icon">🐾</div>
      <div class="name">宠物行业</div>
      <div class="desc">宠物用品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="./fmcg/">
      <div class="icon">🛒</div>
      <div class="name">快消行业</div>
      <div class="desc">快消品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="./beauty/">
      <div class="icon">💄</div>
      <div class="name">美妆行业</div>
      <div class="desc">美妆个护数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="./baby/">
      <div class="icon">🍼</div>
      <div class="name">母婴行业</div>
      <div class="desc">母婴用品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="./home/">
      <div class="icon">🏠</div>
      <div class="name">家居行业</div>
      <div class="desc">家居用品数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
    <a class="card" href="./fashion/">
      <div class="icon">👗</div>
      <div class="name">鞋服行业</div>
      <div class="desc">鞋服品牌数字人直播</div>
      <div class="arrow">查看案例 →</div>
    </a>
  </div>
  <div class="footer">点击行业卡片，查看真实直播回放</div>
</body>
</html>
