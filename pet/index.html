<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宠物直播案例 · 扫码观看</title>
<style>
  :root {
    --paper: #F6F1E9;
    --ink: #241C15;
    --muted: #8A7F70;
    --line: #E6DCCE;
    --card: #FFFFFF;
    --accent: #E2763C;
    --accent2: #8A6A45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
    padding-bottom: 100px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* 紧凑顶部 */
  .hero {
    margin: 0 -16px 16px;
    padding: 32px 20px 28px;
    color: #fff;
    background: linear-gradient(155deg, var(--accent) 0%, var(--accent2) 100%);
  }
  .hero h1 {
    font-size: 26px; font-weight: 800;
    line-height: 1.3;
  }
  .hero .sub {
    margin-top: 6px; font-size: 13px;
    color: rgba(255,255,255,0.85);
  }

  /* 快速导航 */
  .nav {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 4px 0 12px;
    -webkit-overflow-scrolling: touch;
  }
  .nav-pill {
    flex-shrink: 0;
    padding: 6px 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-pill:active { background: var(--accent); color: #fff; }

  /* 案例卡片 */
  .case {
    margin-bottom: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .stage { background: #14100C; }
  video { display: block; width: 100%; aspect-ratio: 0.453; object-fit: contain; background: #14100C; }
  .info { padding: 12px 14px 14px; }
  .info-top { display: flex; align-items: center; justify-content: space-between; }
  .info-top h2 { font-size: 16px; font-weight: 700; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    border-radius: 4px;
  }
  .desc { margin-top: 4px; font-size: 13px; color: var(--muted); }

  /* 底部联系 */
  .contact {
    margin-top: 24px;
    padding: 24px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: center;
  }
  .contact h3 { font-size: 18px; margin-bottom: 8px; }
  .contact p { font-size: 14px; color: var(--muted); }
  .contact .phone { margin-top: 8px; font-size: 20px; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <h1>宠物直播案例</h1>
      <p class="sub">AI数字人直播 · 7×24小时智能直播解决方案</p>
    </div>
  </div>

  <div class="wrap">
    <div class="nav">
      <a href="#video_1" class="nav-pill">ACANA 爱肯拿</a>
<a href="#video_2" class="nav-pill">ACANA 爱肯拿</a>

      <a href="#contact" class="nav-pill">联系咨询</a>
    </div>
    
  <div class="case" id="video_1">
    <div class="stage">
      <video controls playsinline preload="metadata" src="pet1.mp4"></video>
    </div>
    <div class="info">
      <div class="info-top">
        <h2>ACANA 爱肯拿</h2>
        <span class="tag">案例 1</span>
      </div>
      <p class="desc">品牌专场直播回放</p>
    </div>
  </div>
  <div class="case" id="video_2">
    <div class="stage">
      <video controls playsinline preload="metadata" src="pet2.mp4"></video>
    </div>
    <div class="info">
      <div class="info-top">
        <h2>ACANA 爱肯拿</h2>
        <span class="tag">案例 2</span>
      </div>
      <p class="desc">直播间界面展示</p>
    </div>
  </div>

    <div class="contact" id="contact">
      <h3>看完案例，聊聊你的直播间</h3>
      <p>一知智能 · AI互动营销Agent产业引领者</p>
      <div class="phone">153 5663 5669</div>
    </div>
  </div>
</body>
</html>
