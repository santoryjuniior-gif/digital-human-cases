<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>母婴直播案例 · 扫码观看</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
  :root {
    --paper: #F6F1E9;
    --ink: #241C15;
    --muted: #8A7F70;
    --line: #E6DCCE;
    --card: #FFFFFF;
    --accent: #2FA39C;
    --accent2: #1E6F6A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">AI 母婴直播案例</span>
    <h1>直播案例精选</h1>
    <p class="sub">母婴品牌直播间实录，点击播放即可观看。</p>
  </header>

  <section class="case is-first">
    <div class="stage">
      <video class="is-first" controls playsinline preload="metadata" poster="https://nickchen19941005-dot.github.io/digital-human-cases/baby/babycare_poster.jpg"
             src="https://nickchen19941005-dot.github.io/digital-human-cases/baby/babycare.mp4"></video>
      <button class="play" type="button" aria-label="播放案例视频">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72c0 .81.88 1.31 1.57.89l10.8-6.86a1.05 1.05 0 0 0 0-1.78L9.57 4.25A1.04 1.04 0 0 0 8 5.14Z"/></svg>
      </button>
    </div>
    <div class="info">
      <div class="info-top">
        <div class="brand"><span class="dot"></span><h2>Babycare</h2></div>
        <span class="duration">00:28</span>
      </div>
      <p class="desc">母婴直播实录 · 大件国补专区婴童用品讲解。</p>
      <div class="tags"><span class="tag">母婴直播</span><span class="tag">国补好物</span></div>
    </div>
  </section>

  <section class="case is-second">
    <div class="stage">
      <video class="is-second" controls playsinline preload="metadata" poster="https://nickchen19941005-dot.github.io/digital-human-cases/baby/babycare2_poster.jpg"
             src="https://nickchen19941005-dot.github.io/digital-human-cases/baby/babycare2.mp4"></video>
      <button class="play" type="button" aria-label="播放案例视频">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72c0 .81.88 1.31 1.57.89l10.8-6.86a1.05 1.05 0 0 0 0-1.78L9.57 4.25A1.04 1.04 0 0 0 8 5.14Z"/></svg>
      </button>
    </div>
    <div class="info">
      <div class="info-top">
        <div class="brand"><span class="dot"></span><h2>Babycare</h2></div>
        <span class="duration">00:31</span>
      </div>
      <p class="desc">母婴直播实录 · 儿童保温杯细节展示讲解。</p>
      <div class="tags"><span class="tag">母婴直播</span><span class="tag">产品特写</span></div>
    </div>
  </section>

  <section class="case is-third">
    <div class="stage">
      <video class="is-third" controls playsinline preload="metadata" poster="https://nickchen19941005-dot.github.io/digital-human-cases/baby/bebebus_poster.jpg"
             src="https://nickchen19941005-dot.github.io/digital-human-cases/baby/bebebus.mp4"></video>
      <button class="play" type="button" aria-label="播放案例视频">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72c0 .81.88 1.31 1.57.89l10.8-6.86a1.05 1.05 0 0 0 0-1.78L9.57 4.25A1.04 1.04 0 0 0 8 5.14Z"/></svg>
      </button>
    </div>
    <div class="info">
      <div class="info-top">
        <div class="brand"><span class="dot"></span><h2>BeBeBus</h2></div>
        <span class="duration">00:29</span>
      </div>
      <p class="desc">母婴直播实录 · 乳木果润尿裤夏季透气讲解。</p>
      <div class="tags"><span class="tag">母婴直播</span><span class="tag">AI推荐官</span></div>
    </div>
  </section>

  <footer>AI 母婴直播案例展示 · 建议使用手机全屏观看</footer>
</div>

<script>
  (function () {
    var stages = document.querySelectorAll('.stage');
    Array.prototype.forEach.call(stages, function (stage) {
      var video = stage.querySelector('video');
      var play = stage.querySelector('.play');
      play.addEventListener('click', function () {
        var p = video.play();
        if (p && p.catch) { p.catch(function () {}); }
      });
      video.addEventListener('play', function () { play.classList.add('hidden'); });
      video.addEventListener('pause', function () { play.classList.remove('hidden'); });
      video.addEventListener('ended', function () { play.classList.remove('hidden'); });
    });
  })();
</script>
</body>
</html>
